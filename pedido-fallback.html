<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Você recebeu um pedido — Cardume TCG</title>
  <meta name="description" content="Baixe o app Cardume para ver os detalhes do seu pedido." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-base:    #080F1A;
      --bg-surface: #111E2D;
      --brand:      #11D8E8;
      --brand-dark: #0891A0;
      --text:       #F2F5F8;
      --text-muted: #9AAFC1;
      --border:     rgba(242,245,248,0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      padding: 24px; display: flex; justify-content: center;
    }
    .nav-logo { height: 32px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      letter-spacing: -.02em;
      max-width: 480px;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 420px;
      margin-bottom: 32px;
    }
    .stores {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn-primary, .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--brand);
      color: var(--bg-base);
    }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #16273A; }
    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 13px;
    }
    footer a { color: var(--text-muted); }
  </style>
</head>
<body>

  <nav>
    <img class="nav-logo" src="/assets/horizontal.svg" alt="Cardume TCG" />
  </nav>

  <main>
    <div class="icon">🐟</div>
    <h1>Você recebeu um pedido do Cardume!</h1>
    <p>Baixe o app para ver os detalhes e participar do grupo.</p>
    <div class="stores">
      <a class="btn-primary" href="https://apps.apple.com/br/app/cardume-tcg/id6768480656" target="_blank" rel="noopener" aria-label="Baixar na App Store">App Store</a>
      <a class="btn-secondary" href="https://play.google.com/store/apps/details?id=com.cardume.android&hl=pt_BR" target="_blank" rel="noopener" aria-label="Baixar no Google Play">Google Play</a>
    </div>
  </main>

  <footer>
    <p>© 2026 Cardume. Todos os direitos reservados. · <a href="/app/">card-u.me</a></p>
  </footer>

</body>
</html>
